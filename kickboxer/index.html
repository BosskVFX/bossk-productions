<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="/kickboxer/">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<title>Kickboxer: Rebirth — The Door</title>
<style>
  :root { --bg: #0b0806; --ink: #f1e6d4; --oxblood: #7a1f1a; --gold: #d9a441; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { width: min(100vw, calc(100vh * 16 / 9)); height: auto; aspect-ratio: 16 / 9;
    image-rendering: auto; background: #000; box-shadow: 0 0 60px #000; }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="1920" height="1080"></canvas></div>
<script src="assets/sprites/sprites.js"></script>
<script src="assets/frames/frames.js"></script>
<script src="game.js"></script>
</body>
</html>
