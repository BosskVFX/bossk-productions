<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BOSSK</title>
<style>
  :root { --bg: #000; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; cursor: none; }
  .stage { position: fixed; inset: 0; display: grid; place-items: center; }
  video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 400ms ease; }
  video.on { opacity: 1; }
  .glow { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: screen; opacity: 0;
          background: radial-gradient(circle at 50% 50%, rgba(255,107,53,0.55), rgba(255,107,53,0) 60%); transition: opacity 120ms linear; }
  .fallback { position: absolute; width: 28vmin; height: 28vmin; border-radius: 50%; background: #ff6b35; opacity: 0.9;
              transition: transform 120ms ease-out; display: none; }
  canvas#ring { position: absolute; width: 60vmin; height: 60vmin; pointer-events: none; }
  .caption { position: absolute; bottom: 6vh; width: 100%; text-align: center; color: #f0ede8; font: 500 2.2vmin/1.4 -apple-system, "DM Sans", sans-serif;
             opacity: 0.0; transition: opacity 300ms; letter-spacing: 0.02em; }
  .caption.on { opacity: 0.85; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="fallback" id="fallback"></div>
  <canvas id="ring" width="800" height="800"></canvas>
  <div class="glow" id="glow"></div>
  <div class="caption" id="caption"></div>
</div>
<script>
// Bare expressions window. Drop videos named idle.mp4, listening.mp4, thinking.mp4, speaking.mp4, asking.mp4
// into ~/.bossk/expressions. The daemon's state picks the clip; mic and speech level drive scale and glow.
// No videos yet -> an orange disc that breathes with the level, so the loop can be felt before the art exists.
const stage = document.getElementById('stage'), glow = document.getElementById('glow');
const fallback = document.getElementById('fallback'), caption = document.getElementById('caption');
const vids = {}; let current = null, videos = {};
async function loadVideos() {
  try { videos = await (await fetch('/videos.json')).json(); } catch (e) { videos = {}; }
  for (const [state, src] of Object.entries(videos)) {
    const v = document.createElement('video'); v.src = src; v.loop = true; v.muted = true; v.playsInline = true; v.preload = 'auto';
    stage.insertBefore(v, fallback); vids[state] = v; v.play().catch(() => {});
  }
  if (!Object.keys(videos).length) fallback.style.display = 'block';
}
function show(state) {
  const pick = vids[state] || vids['idle'] || null;
  if (pick === current) return;
  for (const v of Object.values(vids)) v.classList.toggle('on', v === pick);
  current = pick;
}
let smooth = 0;
async function tick() {
  try {
    const s = await (await fetch('/state.json')).json();
    show(s.state);
    smooth = smooth * 0.6 + (s.level || 0) * 0.4;
    const scale = 1 + smooth * 0.08;
    if (current) current.style.transform = `scale(${scale})`;
    fallback.style.transform = `scale(${1 + smooth * 0.5})`;
    glow.style.opacity = s.state === 'speaking' || s.state === 'asking' ? 0.25 + smooth * 0.6 : smooth * 0.5;
    caption.textContent = s.text || ''; caption.classList.toggle('on', !!s.text && s.state !== 'idle');
    drawRing(s.waveform || [], s.state, s.pending_ask);
  } catch (e) {}
  setTimeout(tick, 80);
}
// 64-point waveform ring around the face: the mic while listening, BOSSK's voice while speaking.
const ring = document.getElementById('ring'), rc = ring.getContext('2d');
function drawRing(wf, state, pending) {
  rc.clearRect(0, 0, 800, 800);
  const n = 64, r0 = 300, color = state === 'listening' ? '240,237,232' : '255,107,53';
  rc.strokeStyle = `rgba(${color},${state === 'idle' && !pending ? 0.15 : 0.8})`; rc.lineWidth = 6; rc.lineCap = 'round';
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 - Math.PI / 2, v = Math.min(1, Math.abs(wf[i] || 0));
    const len = 8 + v * 90 + (pending && state !== 'listening' ? 6 * (1 + Math.sin(Date.now() / 300)) : 0);
    rc.beginPath();
    rc.moveTo(400 + Math.cos(a) * r0, 400 + Math.sin(a) * r0);
    rc.lineTo(400 + Math.cos(a) * (r0 + len), 400 + Math.sin(a) * (r0 + len));
    rc.stroke();
  }
}
loadVideos().then(tick);
document.addEventListener('keydown', e => { if (e.key === 'f') document.documentElement.requestFullscreen?.(); });
</script>
</body>
</html>
