# Copy to ~/.bossk/voice.yml on the Mac mini. Core URL, token and machine name come from ~/.bossk/agent.json
# (written by bossk_hook.py install --can-speak).
agent_file: ~/.bossk/agent.json
secrets_file: ~/.bossk/secrets.env        # PICOVOICE_ACCESS_KEY=... (the only key that lives on the mini)

# Wake word: Porcupine. Train "Hey BOSSK" at console.picovoice.ai, download the macOS .ppn, point at it.
wake_keyword_path: ~/.bossk/hey-bossk_mac.ppn
wake_sensitivity: 0.6
mic_index: -1                              # pvrecorder device index; -1 = default input

# Speech-to-text: whisper.cpp.  brew install whisper-cpp ; download ggml-large-v3-turbo.bin (and the Core ML encoder)
whisper_model: ~/.bossk/models/ggml-large-v3-turbo.bin
whisper_threads: 6
listen_seconds: 8

# Text-to-speech: "core" asks the NAS for ElevenLabs audio (key stays on the NAS) with macOS `say` as fallback; "say" = Apple only.
tts: core
voice: ""                                  # ElevenLabs voice id once Jason picks one; empty = the core's default
say_voice: Samantha
tts_cache: ~/.bossk/tts_cache
phrases_file: ~/.bossk/phrases.yml         # optional overrides of the fixed phrases

# Expressions window: http://127.0.0.1:8751/  (videos in ~/.bossk/expressions: idle, listening, thinking, speaking, asking)
expressions_window: true
expressions_port: 8751
state_file: ~/.bossk/voice_state.json
