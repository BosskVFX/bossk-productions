# ~/.bossk/voice.yml on the Mac mini. Core URL, token and machine name come from ~/.bossk/agent.json
# (written by: python3 agents/hooks/bossk_hook.py install ... --can-speak).
agent_file: ~/.bossk/agent.json

# Push-to-talk. Hold the key to talk, let go when done; press while BOSSK talks to cut it off.
# Use a button plugged into the Mac mini itself (Stream Deck key set to F19, a foot pedal, a macro pad),
# so it works wherever Synergy has the mouse. Grant Input Monitoring + Accessibility to the Python running this.
talk_key: f19
talk_mode: hold            # hold | toggle (tap to start, stops itself after a pause)
# Stream Deck alternative: HTTP-request buttons to http://127.0.0.1:8751/ptt/toggle  (and /ptt/stop)

# Speech-to-text, local and free: mlx (Apple GPU, default) | faster-whisper | whisper-cpp
stt: mlx
stt_model: mlx-community/whisper-large-v3-turbo

# Voice, local and free: kokoro (default) | elevenlabs (through Mother, once a voice is picked) | say (macOS)
tts: kokoro
kokoro_voice: bm_lewis     # British male. Try bm_george, bm_fable, am_michael, af_heart
kokoro_speed: 1.05
say_voice: Daniel          # fallback
voice: ""                  # ElevenLabs voice id, only for tts: elevenlabs

mic_device:                # blank = system default input
min_press_s: 0.3           # shorter than this with no speech = just an interrupt tap
toggle_silence_s: 1.2
chime: ~/.bossk/chime.wav  # optional sound before BOSSK asks something

expressions_window: true   # http://127.0.0.1:8751/  press f for full screen
expressions_port: 8751
state_file: ~/.bossk/voice_state.json
